<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SWAT NA CIDADE — Ingressos</title>
  <meta name="description" content="Compre seu ingresso para SWAT NA CIDADE." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="logo">Ingressos</a>
      <button class="link-btn">Minha conta ▾</button>
    </div>
  </header>

  <div class="container">
    <nav class="tabs">
      <button class="tab active">Sobre</button>
      <button class="tab">Instruções</button>
    </nav>
  </div>

  <main class="container layout">
    <section>
      <div class="hero">
        <img id="event-image"
          src=""
          alt="Carregando imagem do evento..."
          loading="eager"
          decoding="async"
          fetchpriority="high"
          width="800"
          height="520"
        />
      </div>

      <div class="title-row">
        <div>
          <h1 id="event-title">Carregando evento...</h1>
          <p class="muted">Criado por <a href="#" class="link">Limitless Events</a> · Festa para todos</p>
          <a href="#" class="btn-outline">Patrocinar</a>
        </div>
      </div>

      <hr />

      <h2 class="section-title">Sobre</h2>
      <div class="about" id="event-description">
        <p>Carregando descrição...</p>
      </div>
    </section>

    <aside class="sidebar">
      <p class="price"><span class="muted">A partir de </span><strong id="event-price">...</strong></p>
      <hr />
      <div class="row">
        <span class="badge">PROIBIDA A ENTRADA DE MENORES DE 18 ANOS.</span>
      </div>
      <div class="row">
        <div>
          <p id="event-date">Carregando data...</p>
          <a href="#" class="link small">Adicionar ao calendário</a>
        </div>
      </div>
      <div class="row">
        <div>
          <p id="event-location">Carregando local...</p>
          <a href="#" class="link small">Ver mapa</a>
        </div>
      </div>
      <a id="open-btn" class="btn-primary" href="compra.html">Ingressos</a>
    </aside>
  </main>

  <script src="event.js" defer></script>
</body>
</html>
